name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk@v3
        id: snake
        with:
          github_user_name: ${{ github.repository_owner }}
          # Brand-blue palette (#1071ea) to match the profile theme.
          outputs: |
            dist/github-snake.svg?color_snake=#1071ea&color_dots=#dde4ef,#a9d1ff,#54a4ff,#1071ea,#0b5bd0
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#1071ea&color_dots=#161a21,#0b5bd0,#1071ea,#54a4ff,#a9d1ff

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
